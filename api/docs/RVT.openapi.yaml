openapi: 3.1.0
info:
  title: API SDKWOOD — Rapport de visite terrain
  version: 1.0.0
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
  description: |
    Contrat HTTP de l'application SDKWOOD de rapport de visite terrain.

    Le navigateur reste responsable de l'interaction avec le formulaire, de la
    capture GPS, de l'accès à la caméra, de la dictée vocale, des vibrations
    et des liens de partage. L'API est la source de vérité pour les clients,
    les données de référence, les tournées commerciales, les visites, les
    photos, les analyses et les exports.

    L'intégration ERP est une préoccupation interne du serveur et n'est pas
    exposée par ce contrat. L'API attend un jeton pré-émis dans l'en-tête
    `auth_token`. Ce contrat ne définit aucun point d'entrée de connexion ou
    d'émission de jeton.

    ## Enveloppe des réponses
    Toutes les réponses réussies utilisent une enveloppe commune :
      - `status` : booléen, `true` si l'opération a réussi, `false` sinon ;
      - `data` : contient les données retournées (objet, tableau ou `null`) ;
      - `pagination` : présent uniquement pour les points d'entrée qui
        retournent une liste paginée, avec `page`, `perPage`, `total` et
        `totalPages`.

    Exemple pour une ressource unique :

        {
          "status": true,
          "data": { ... }
        }

    Exemple pour une liste paginée :

        {
          "status": true,
          "data": [ ... ],
          "pagination": {
            "page": 1,
            "perPage": 10,
            "total": 3,
            "totalPages": 1
          }
        }

    Les points d'entrée d'export (`/visits/{visitId}/export`,
    `/rounds/{roundId}/export`, `/exports/visits`) retournent directement un
    fichier binaire (PDF, CSV) ou un document JSON brut : ils ne suivent pas
    cette enveloppe.
servers:
  - url: http://{backendHost}
    description: Backend PHP SDKBOARD (développement local)
    variables:
      backendHost:
        default: localhost:8075
        description: Hôte et port du back-office SDKBOARD (ex. localhost:8075)
  - url: https://{apiHost}/api/v1
    description: Serveur d'API (production)
    variables:
      apiHost:
        default: api.sdkwood.ma
        description: Nom d'hôte public de l'API
  - url: http://{localHost}:3001/api/v1
    description: Développement local
    variables:
      localHost:
        default: 127.0.0.1
        description: Nom d'hôte local de l'API
tags:
  - name: Clients
    description: Référentiel clients ERP
  - name: Données de référence
    description: Produits et options du formulaire
  - name: Tournées
    description: Tournées et sessions commerciales
  - name: Visites
    description: Persistance des rapports de visite
  - name: Photos
    description: Traitement et stockage serveur des photos de visite
  - name: Analyses
    description: Indicateurs agrégés des visites
security:
  - authToken: []
paths:
  /sdkboard/api/users/clients.php:
    get:
      tags: [Clients]
      operationId: listClients
      summary: Récupérer la liste des clients ERP
      description: |
        Point d'entrée du back-office SDKBOARD. Seule la méthode GET est
        prise en charge, sans aucun paramètre. Retourne la liste complète des
        clients (triés par raison sociale) avec l'enveloppe `status`/`data`,
        sans pagination. Il n'existe pas de point d'entrée pour un client
        unique.
      responses:
        "200":
          description: Liste des clients ERP
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ErpClient"
        "401":
          $ref: "#/components/responses/NonAutorise"

  /sdkboard/api/homescreen/rapport_terrain.php:
    get:
      tags: [Données de référence]
      operationId: getReferenceData
      summary: Récupérer le catalogue et les options du formulaire
      description: |
        Retourne les données actuellement regroupées dans `src/data/*`, mais
        gérées par le serveur. Le frontal peut charger ces données une fois au
        démarrage et utiliser les cartes d'options de détail produit pour
        afficher les champs dépendants.
      responses:
        "200":
          description: Instantané des données de référence
          headers:
            ETag:
              description: Identifiant de version pour un cache conditionnel
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/ReferenceData"
        "401":
          $ref: "#/components/responses/NonAutorise"

  /sdkboard/api/rounds/rounds.php:
    post:
      tags: [Tournées]
      operationId: createRound
      summary: Ouvrir une nouvelle tournée commerciale
      description: |
        Point d'entrée PHP unique `/sdkboard/api/rounds/rounds.php`. Le serveur
        dérive `commercialId` depuis `auth_token` et rejette la création tant
        qu'une tournée est déjà ouverte pour ce commercial (409
        `ROUND_ALREADY_OPEN`). `idempotencyKey` est transmise dans l'URL ; la
        même clé rejoue la création sans doublon.
      parameters:
        - name: idempotencyKey
          in: query
          required: true
          description: Clé unique générée côté client (8 à 200 caractères), transmise dans l'URL
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundCreate"
      responses:
        "201":
          description: Tournée ouverte
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "409":
          $ref: "#/components/responses/Conflit"
        "422":
          $ref: "#/components/responses/ErreurValidation"
    get:
      tags: [Tournées]
      operationId: getRounds
      summary: Récupérer une tournée ou lister les tournées du commercial
      description: |
        Comportement piloté par les paramètres de requête :
          - si `id` est fourni → retourne une seule tournée (`{status, data}`) ;
          - sinon, retourne la liste paginée des tournées du commercial courant
            (`{status, data, pagination}`).
        Le filtre `status` accepte `open` (en cours) ou `closed` (terminée ou
        annulée). Les filtres `from`/`to` portent sur la date de début.
      parameters:
        - name: id
          in: query
          description: Identifiant de la tournée (retourne une seule tournée si fourni)
          schema:
            type: string
        - name: status
          in: query
          description: Filtrer par statut de la tournée
          schema:
            $ref: "#/components/schemas/RoundStatus"
        - name: from
          in: query
          description: Inclure les tournées démarrées à partir de cette date
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclure les tournées démarrées avant ou à cette date
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Tournée unique (si `id` fourni) ou liste paginée de tournées
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [status, data]
                    properties:
                      status:
                        type: boolean
                        description: true si l'opération a réussi, false sinon.
                        example: true
                      data:
                        $ref: "#/components/schemas/Round"
                  - type: object
                    additionalProperties: false
                    required: [status, data, pagination]
                    properties:
                      status:
                        type: boolean
                        description: true si l'opération a réussi, false sinon.
                        example: true
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Round"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "422":
          $ref: "#/components/responses/ErreurValidation"

  /sdkboard/api/rounds/rounds.php/close:
    post:
      tags: [Tournées]
      operationId: closeRound
      summary: Clôturer une tournée commerciale
      description: |
        Appel réel : `POST /sdkboard/api/rounds/rounds.php?action=close&id={roundId}`.
        La clôture est refusée si la tournée n'est plus en cours (409
        `ROUND_ALREADY_CLOSED`).
      parameters:
        - name: action
          in: query
          required: true
          description: Action `close` (le serveur route la clôture via ce paramètre)
          schema:
            type: string
            enum: [close]
        - name: id
          in: query
          required: true
          description: Identifiant de la tournée
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundClose"
      responses:
        "200":
          description: Tournée clôturée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"

  /sdkboard/api/rounds/visits.php:
    post:
      tags: [Visites]
      operationId: createVisit
      summary: Soumettre un rapport de visite
      description: |
        Point d'entrée PHP unique `/sdkboard/api/rounds/visits.php`. Sans
        paramètre `action`, crée le rapport : `roundId` est attendu dans le
        corps de la requête et `idempotencyKey` dans l'URL. La requête est
        rejetée lorsque la tournée est clôturée (409 `ROUND_CLOSED`). La même
        clé d'idempotence pour la même tournée rejoue la création sans doublon.
      parameters:
        - name: idempotencyKey
          in: query
          required: true
          description: Clé unique générée côté client (8 à 200 caractères), transmise dans l'URL
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitCreate"
      responses:
        "201":
          description: Rapport de visite persisté
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/VisitReport"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "422":
          $ref: "#/components/responses/ErreurValidation"
    get:
      tags: [Visites]
      operationId: getVisits
      summary: Récupérer une visite ou lister les visites d'une tournée
      description: |
        Comportement piloté par les paramètres de requête :
          - si `id` est fourni → retourne une seule visite (`{status, data}`) ;
          - sinon, `roundId` est obligatoire → retourne la liste paginée
            (`{status, data, pagination}`).
      parameters:
        - name: id
          in: query
          description: Identifiant de la visite (retourne une seule visite si fourni)
          schema:
            type: string
        - name: roundId
          in: query
          description: Identifiant de la tournée (obligatoire pour lister les visites)
          schema:
            type: string
        - name: clientId
          in: query
          description: Filtrer par identifiant de client
          schema:
            type: string
        - name: city
          in: query
          description: Filtrer par ville
          schema:
            type: string
            maxLength: 120
        - name: result
          in: query
          description: Filtrer par résultat de visite
          schema:
            $ref: "#/components/schemas/VisitResult"
        - name: opportunityDetected
          in: query
          description: Filtrer par présence d'une opportunité détectée
          schema:
            type: boolean
        - name: from
          in: query
          description: Visites terminées à partir de cet instant
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Visites terminées avant ou à cet instant
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: "Expression de tri. Valeurs prises en charge : `completedAt`, `-completedAt`, `createdAt` et `-createdAt`."
          schema:
            type: string
            enum: [completedAt, -completedAt, createdAt, -createdAt]
            default: -completedAt
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Visite unique (si `id` fourni) ou liste paginée de visites
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [status, data]
                    properties:
                      status:
                        type: boolean
                        description: true si l'opération a réussi, false sinon.
                        example: true
                      data:
                        $ref: "#/components/schemas/VisitReport"
                  - type: object
                    additionalProperties: false
                    required: [status, data, pagination]
                    properties:
                      status:
                        type: boolean
                        description: true si l'opération a réussi, false sinon.
                        example: true
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VisitReport"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "422":
          $ref: "#/components/responses/ErreurValidation"
    patch:
      tags: [Visites]
      operationId: updateVisit
      summary: Mettre à jour un rapport de visite
      description: |
        Appel réel : `PATCH /sdkboard/api/rounds/visits.php?id={visitId}`.
        Incrémente la version du rapport. Le client doit envoyer dans `If-Match`
        la version lue précédemment afin d'éviter les mises à jour perdues
        (409 `VERSION_MISMATCH`).
      parameters:
        - name: id
          in: query
          required: true
          description: Identifiant de la visite
          schema:
            type: string
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitPatch"
      responses:
        "200":
          description: Rapport de visite mis à jour
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/VisitReport"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "422":
          $ref: "#/components/responses/ErreurValidation"
    delete:
      tags: [Visites]
      operationId: deleteVisit
      summary: Supprimer un rapport de visite
      description: |
        Appel réel : `DELETE /sdkboard/api/rounds/visits.php?id={visitId}`.
        Extension implémentée côté serveur mais non exposée dans l'interface
        de l'application. Un utilisateur `commercial` ne peut supprimer que
        ses propres visites (403 sinon).
      parameters:
        - name: id
          in: query
          required: true
          description: Identifiant de la visite
          schema:
            type: string
      responses:
        "200":
          description: Visite supprimée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    type: "null"
                    description: Aucune donnée n'est retournée pour cette opération.
        "401":
          $ref: "#/components/responses/NonAutorise"
        "403":
          description: Accès refusé (visite d'un autre commercial)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Introuvable"

  /sdkboard/api/rounds/visits.php/photos:
    post:
      tags: [Photos]
      operationId: uploadVisitPhoto
      summary: Envoyer et traiter une photo de visite
      description: |
        Appel réel : `POST /sdkboard/api/rounds/visits.php?action=addPhoto&id={visitId}`.
        Un seul fichier par appel, champ `file`. Maximum 5 photos par visite.
        Extensions autorisées : jpg, jpeg, png, webp (taille maximale 8 Mo).
      parameters:
        - name: action
          in: query
          required: true
          description: Action `addPhoto` (le serveur route l'upload via ce paramètre)
          schema:
            type: string
            enum: [addPhoto]
        - name: id
          in: query
          required: true
          description: Identifiant de la visite
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "201":
          description: Métadonnées de la photo stockée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/VisitPhoto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "413":
          description: Le fichier envoyé est trop volumineux (maximum 8 Mo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ErreurValidation"

  /sdkboard/api/rounds/visits.php/photos/{photoId}:
    delete:
      tags: [Photos]
      operationId: deleteVisitPhoto
      summary: Retirer une photo d'une visite
      description: |
        Appel réel : `DELETE /sdkboard/api/rounds/visits.php?action=deletePhoto&id={visitId}&photoId={photoId}`.
      parameters:
        - name: action
          in: query
          required: true
          description: Action `deletePhoto` (le serveur route la suppression via ce paramètre)
          schema:
            type: string
            enum: [deletePhoto]
        - name: id
          in: query
          required: true
          description: Identifiant de la visite
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          description: Identifiant de la photo
          schema:
            type: string
      responses:
        "200":
          description: Photo supprimée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    type: "null"
                    description: Aucune donnée n'est retournée pour cette opération.
        "401":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"

  /sdkboard/api/rounds/analytics.php:
    get:
      tags: [Analyses]
      operationId: getAnalytics
      summary: Obtenir les indicateurs du tableau de bord des visites
      description: |
        Point d'entrée PHP unique `/sdkboard/api/rounds/analytics.php` (GET
        uniquement). Calcule les agrégats sur les visites filtrées. Pour un
        utilisateur `commercial`, les visites sont limitées aux siennes.
        Les classements (`*Ranking`) retournent le top 10 trié par occurrences
        décroissantes ; `productRanking` et `competitorRanking` utilisent les
        identifiants (`productId` / `competitorId`) comme libellé. Aucun
        `roundId` n'est requis.
      parameters:
        - name: roundId
          in: query
          description: Filtrer par identifiant de tournée
          schema:
            type: string
        - name: clientId
          in: query
          description: Filtrer par identifiant de client
          schema:
            type: string
        - name: city
          in: query
          description: Filtrer par ville (recherchée dans la localisation de la visite)
          schema:
            type: string
        - name: from
          in: query
          description: Visites terminées à partir de cet instant (422 si invalide)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Visites terminées avant ou à cet instant (422 si invalide)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Indicateurs agrégés du tableau de bord
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, data]
                properties:
                  status:
                    type: boolean
                    description: true si l'opération a réussi, false sinon.
                    example: true
                  data:
                    $ref: "#/components/schemas/DashboardData"
        "401":
          $ref: "#/components/responses/NonAutorise"
        "422":
          $ref: "#/components/responses/ErreurValidation"

components:
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: auth_token
      description: Jeton d'application pré-émis. L'émission du jeton est en dehors de cette API.

  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page à retourner (commence à 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      description: Nombre d'éléments par page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version retournée lors de la dernière lecture, par exemple `2`
      schema:
        type: string
        pattern: "^[0-9]+$"

  responses:
    RequeteInvalide:
      description: Requête malformée
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NonAutorise:
      description: Jeton `auth_token` manquant ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Introuvable:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflit:
      description: Conflit d'état ou d'idempotence
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ErreurValidation:
      description: Validation métier en échec
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message]
      properties:
        status:
          type: boolean
          description: Toujours `false` pour une erreur.
          example: false
        code:
