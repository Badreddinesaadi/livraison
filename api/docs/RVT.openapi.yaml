          commercialId,
          createdAt,
          startedAt,
          completedAt,
          durationSeconds,
          syncStatus,
          idempotencyKey,
          client,
          location,
          observedActivities,
          equipment,
          equipmentQuantities,
          products,
          brands,
          competitors,
          opportunity,
          results,
          photos,
        ]
      properties:
        id:
          type: string
          description: Identifiant du rapport
        visitId:
          type: string
          description: Identifiant métier de la visite
        version:
          type: integer
          minimum: 1
          description: Version du rapport (incrémentée à chaque mise à jour)
        roundId:
          type: string
          description: Identifiant de la tournée
        commercialId:
          type: string
          description: Identifiant du commercial
        createdAt:
          type: string
          format: date-time
          description: Date de création du rapport
        updatedAt:
          type: string
          format: date-time
          description: Date de dernière mise à jour
        startedAt:
          type: string
          format: date-time
          description: Date de début de la visite
        completedAt:
          type: string
          format: date-time
          description: Date d'achèvement de la visite
        durationSeconds:
          type: integer
          minimum: 0
          description: Durée de la visite en secondes
        syncStatus:
          $ref: "#/components/schemas/SyncStatus"
        idempotencyKey:
          type: string
          description: Clé d'idempotence de la création
        client:
          $ref: "#/components/schemas/Client"
        location:
          $ref: "#/components/schemas/Location"
        contactRole:
          $ref: "#/components/schemas/ContactRole"
        contactOther:
          type: string
          description: Précision du contact lorsque le rôle est « Autre »
        activityLevel:
          $ref: "#/components/schemas/ActivityLevel"
        observedActivities:
          type: array
          description: Activités observées
          items:
            $ref: "#/components/schemas/ObservedActivity"
        equipment:
          type: array
          description: Équipements observés
          items:
            type: string
        equipmentQuantities:
          type: object
          description: Quantités observées par équipement
          additionalProperties:
            type: integer
        constructionSite:
          $ref: "#/components/schemas/ConstructionSite"
        industrialSite:
          $ref: "#/components/schemas/IndustrialSite"
        resellerSite:
          $ref: "#/components/schemas/ResellerSite"
        siteSize:
          $ref: "#/components/schemas/ParkSize"
        products:
          type: array
          description: Produits observés
          items:
            $ref: "#/components/schemas/ObservedProduct"
        otherProduct:
          type: string
          description: Autre produit libre
        brands:
          type: array
          description: Marques observées
          items:
            $ref: "#/components/schemas/ObservedBrand"
        competitors:
          type: array
          description: Concurrents observés
          items:
            $ref: "#/components/schemas/ObservedCompetitor"
        sdkPosition:
          $ref: "#/components/schemas/SDKPosition"
        opportunity:
          $ref: "#/components/schemas/Opportunity"
        results:
          type: array
          description: Résultats de la visite
          items:
            $ref: "#/components/schemas/VisitResult"
        orderQuantities:
          $ref: "#/components/schemas/OrderQuantities"
        nextAction:
          $ref: "#/components/schemas/NextAction"
        nextActionDueAt:
          type: string
          format: date-time
          description: Échéance de la prochaine action
        note:
          type: string
          description: Note générale de la visite
        photos:
          type: array
          maxItems: 5
          description: Photos associées à la visite
          items:
            $ref: "#/components/schemas/VisitPhoto"

    RoundCreate:
      type: object
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date
          description: Date de début facultative envoyée par le client. Le serveur enregistre la valeur faisant autorité.

    RoundClose:
      type: object
      additionalProperties: false
      properties:
        closedAt:
          type: string
          format: date
          description: Date de clôture facultative envoyée par le client. Le serveur enregistre la valeur faisant autorité.

    Round:
      type: object
      additionalProperties: false
      required: [id, commercialId, startedAt, status, visitCount, syncStatus]
      properties:
        id:
          type: string
          description: Identifiant de la tournée
        commercialId:
          type: string
          description: Identifiant du commercial
        startedAt:
          type: string
          format: date-time
          description: Date de début de la tournée
        closedAt:
          type: string
          format: date-time
          description: Date de clôture de la tournée
        status:
          $ref: "#/components/schemas/RoundStatus"
        visitCount:
          type: integer
          minimum: 0
          description: Nombre de visites enregistrées
        syncStatus:
          $ref: "#/components/schemas/SyncStatus"

    DashboardRanking:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
          description: Libellé du classement
        value:
          type: integer
          minimum: 0
          description: Nombre d'occurrences

    DashboardData:
      type: object
      additionalProperties: false
      required:
        [
          totalReports,
          uniqueClients,
          orders,
          opportunities,
          pendingSync,
          soloQuantity,
          semiCombinedQuantity,
          orderRate,
          opportunityRate,
          averageDurationSeconds,
          activityCounts,
          resultRanking,
          sdkPositionRanking,
          productRanking,
          competitorRanking,
          cityRanking,
        ]
      properties:
        totalReports:
          type: integer
          minimum: 0
          description: Nombre total de rapports
        uniqueClients:
          type: integer
          minimum: 0
          description: Nombre de clients distincts visités
        orders:
          type: integer
          minimum: 0
          description: Nombre de commandes
        opportunities:
          type: integer
          minimum: 0
          description: Nombre d'opportunités détectées
        pendingSync:
          type: integer
          minimum: 0
          description: Rapports en attente de synchronisation ERP (et non d'une file d'attente navigateur hors ligne)
        soloQuantity:
          type: integer
          minimum: 0
          description: Quantité totale commandée en Solo
        semiCombinedQuantity:
          type: integer
          minimum: 0
          description: Quantité totale commandée en Semi-combiné
        orderRate:
          type: integer
          minimum: 0
          maximum: 100
          description: Taux de commande en pourcentage
        opportunityRate:
          type: integer
          minimum: 0
          maximum: 100
          description: Taux d'opportunité en pourcentage
        averageDurationSeconds:
          type: integer
          minimum: 0
          description: Durée moyenne des visites en secondes
        activityCounts:
          type: object
          description: Nombre de visites par activité observée
          additionalProperties:
            type: integer
            minimum: 0
        resultRanking:
          type: array
          description: Classement des résultats de visite
          items:
            $ref: "#/components/schemas/DashboardRanking"
        sdkPositionRanking:
          type: array
          description: Classement des positions SDK
          items:
            $ref: "#/components/schemas/DashboardRanking"
        productRanking:
          type: array
          description: Classement des produits les plus observés
          items:
            $ref: "#/components/schemas/DashboardRanking"
        competitorRanking:
          type: array
          description: Classement des concurrents les plus présents
          items:
            $ref: "#/components/schemas/DashboardRanking"
        cityRanking:
          type: array
          description: Classement des villes visitées
          items:
            $ref: "#/components/schemas/DashboardRanking"
